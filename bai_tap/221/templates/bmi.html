<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tinh chi so BMI</title>
</head>
<body>
    <h2>Tinh chi so BMI</h2>

    <form action="/bmi" method="POST">
        <input type="text" name="cao"
               placeholder="Chieu cao (m)" required>
        <br><br>

        <input type="text" name="nang"
               placeholder="Can nang (kg)" required>
        <br><br>

        <button type="submit">Tinh BMI</button>
    </form>

    {% if values["kq"] != "" %}
        <h3>Chi so BMI: {{ "%.2f"|format(values["kq"]) }}</h3>
        <h3>Phan loai: {{ values["pl"] }}</h3>
    {% endif %}

    {% if error.get("kq") %}
        <p>{{ error["kq"] }}</p>
    {% endif %}
</body>
</html>
