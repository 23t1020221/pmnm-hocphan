
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang chủ</title>
</head>
<body>
    <h1>Trang Chủ</h1>

    {% if session.get('user') %}
        <p>Xin chào {{ session.get('user') }}!</p>
        <a href="{{ url_for('profile') }}">Trang cá nhân</a>
        <br>
        <a href="{{ url_for('logout') }}">Đăng xuất</a>
    {% else %}
        <a href="{{ url_for('login') }}">Đăng nhập</a>
        <br>
        <a href="{{ url_for('register') }}">Đăng ký</a>
    {% endif %}
</body>
</html>
