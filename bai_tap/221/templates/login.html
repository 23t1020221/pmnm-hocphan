<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>
    <h2>Đăng nhập</h2>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p style="color: green;">{{ message }}</p>
        {% endfor %}
    {% endwith %}


<form method="POST" action="{{ url_for('login') }}">
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Tên đăng nhập:</label>
    <input type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" name="username" required>
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Mật khẩu:</label>
    <input type="password" class="form-control" id="exampleInputPassword1" name="password" required>
  </div>
  <div class="mb-3 form-field">
    <input type="checkbox" id="exampleCheck1" class="check">
    <label for="exampleCheck1" name="remember">Ghi nhớ đăng nhập</label>
  </div>
  <button type="submit" class="btn-solid theme-primary">Đăng nhập</button>
  <a href="{{ url_for('register') }}">Đăng ký ngay</a>

</body>
</html>
