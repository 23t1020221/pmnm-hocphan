<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/hp" method="POST">
        <input type="text" step="any" name="cc" placeholder="chuyen can" min="0" max="10" required>
        <br><br>
        <input type="text" step="any" name="gk" placeholder="giua ki"  min="0" max="10" required>
        <br><br>
        <input type="text" step="any" name="ck" placeholder="cuoi ki" min="0" max="10" required>
        <br><br>
        <button type="submit">tinh toan</button>
        {% if values["kq"] is not none %}   
            <h2>Tổng điểm: {{ "%.2f"|format(values["kq"]) }}</h2>
        {% endif %}
        <h2>xep loai {{ values["xl"] }}</h2>
    </form>
    <p><a href="{{ url_for('index') }}">Về trang chủ</a></p>
</body>
</html>
