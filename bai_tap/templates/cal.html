<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/cal" method="POST">
        <input type="number" step="any" name="a" placeholder="Nhập số a" required>
        <br><br>
        <input type="number" step="any" name="b" placeholder="Nhập số b" required>
        <br><br>
        <button type="submit" name="q" value="+">+</button>
        <button type="submit" name="q" value="-">-</button>
        <button type="submit" name="q" value="*">*</button>
        <button type="submit" name="q" value="/">/</button>
        <h2>Kết quả: {{ values["kq"] }}</h2>
        {% if error.get("q") %}<p style="color: red;">{{ error["q"] }}</p>{% endif %}
    </form>
    <a href="{{ url_for('index') }}">Về trang chủ</a>
</body>
</html>
