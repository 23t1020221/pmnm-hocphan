
{% macro render_field(field) %}
<div style="margin-bottom: 15px;">
    {% if field.type == "BooleanField" %}
        {{ field() }}
        {{ field.label }}
    {% else %}
        {{ field.label }}<br>
        {{ field() }}
    {% endif %}

    {% for error in field.errors %}
        <span style="color: red;">{{ error }}</span>
    {% endfor %}
</div>
{% endmacro %}
